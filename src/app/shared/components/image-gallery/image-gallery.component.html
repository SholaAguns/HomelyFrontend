<div
  class="bg-opacity-90 fixed inset-0 z-50 flex items-center justify-center bg-black"
  (click)="onBackdropClick($event)"
>
  <button
    (click)="onClose()"
    class="bg-opacity-80 hover:bg-opacity-100 absolute top-4 right-4 rounded-full bg-white p-3 text-gray-900 transition-all hover:scale-110"
    aria-label="Close gallery"
  >
    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>

  <div class="relative h-full w-full max-w-6xl px-16 py-8">
    <!-- Main Image -->
    <div class="flex h-full items-center justify-center">
      @if (currentImage()) {
        <img
          [src]="currentImage()!.source_url"
          [alt]="currentImage()!.caption || 'Property image'"
          class="max-h-full max-w-full rounded-lg object-contain"
        />
      }
    </div>

    <!-- Navigation Buttons -->
    @if (images.length > 1) {
      <button
        (click)="previousImage()"
        [disabled]="currentIndex() === 0"
        class="bg-opacity-80 hover:bg-opacity-100 absolute top-1/2 left-4 -translate-y-1/2 rounded-full bg-white p-4 text-gray-900 transition-all hover:scale-110 disabled:cursor-not-allowed disabled:opacity-30 disabled:hover:scale-100"
        aria-label="Previous image"
      >
        <svg
          class="h-8 w-8"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          stroke-width="2.5"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </button>

      <button
        (click)="nextImage()"
        [disabled]="currentIndex() === images.length - 1"
        class="bg-opacity-80 hover:bg-opacity-100 absolute top-1/2 right-4 -translate-y-1/2 rounded-full bg-white p-4 text-gray-900 transition-all hover:scale-110 disabled:cursor-not-allowed disabled:opacity-30 disabled:hover:scale-100"
        aria-label="Next image"
      >
        <svg
          class="h-8 w-8"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          stroke-width="2.5"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    }

    <!-- Image Counter and Caption -->
    <div class="absolute right-0 bottom-8 left-0 text-center">
      @if (currentImage()?.caption) {
        <p class="mb-2 text-white">{{ currentImage()!.caption }}</p>
      }
      <p class="text-opacity-80 text-sm text-white">
        {{ currentIndex() + 1 }} / {{ images.length }}
      </p>
    </div>

    <!-- Thumbnail Navigation -->
    @if (images.length > 1) {
      <div class="absolute right-0 bottom-24 left-0 flex justify-center gap-2 overflow-x-auto px-4">
        @for (image of images; track image.id; let i = $index) {
          <button
            (click)="goToImage(i)"
            [class]="
              currentIndex() === i
                ? 'h-16 w-16 flex-shrink-0 rounded border-2 border-white opacity-100'
                : 'h-16 w-16 flex-shrink-0 rounded border-2 border-transparent opacity-60 hover:opacity-100'
            "
          >
            <img
              [src]="image.source_url"
              [alt]="image.caption || 'Thumbnail ' + (i + 1)"
              class="h-full w-full rounded object-cover"
            />
          </button>
        }
      </div>
    }
  </div>
</div>
