<div class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none">
  @for (notification of notificationService.notifications(); track notification.id) {
    <div
      @toastAnimation
      class="pointer-events-auto w-96 rounded-lg shadow-lg border"
      [ngClass]="{
        'bg-green-50 border-green-200 dark:bg-green-900/20 dark:border-green-800': notification.type === 'success',
        'bg-red-50 border-red-200 dark:bg-red-900/20 dark:border-red-800': notification.type === 'error',
        'bg-yellow-50 border-yellow-200 dark:bg-yellow-900/20 dark:border-yellow-800': notification.type === 'warning',
        'bg-blue-50 border-blue-200 dark:bg-blue-900/20 dark:border-blue-800': notification.type === 'info'
      }"
    >
      <div class="flex items-start gap-3 p-4">
        <!-- Icon -->
        <div class="flex-shrink-0">
          <svg
            class="w-6 h-6"
            [ngClass]="{
              'text-green-600 dark:text-green-400': notification.type === 'success',
              'text-red-600 dark:text-red-400': notification.type === 'error',
              'text-yellow-600 dark:text-yellow-400': notification.type === 'warning',
              'text-blue-600 dark:text-blue-400': notification.type === 'info'
            }"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              [attr.d]="getIcon(notification.type)"
            />
          </svg>
        </div>

        <!-- Message -->
        <div class="flex-1 min-w-0">
          <p
            class="text-sm font-medium"
            [ngClass]="{
              'text-green-800 dark:text-green-200': notification.type === 'success',
              'text-red-800 dark:text-red-200': notification.type === 'error',
              'text-yellow-800 dark:text-yellow-200': notification.type === 'warning',
              'text-blue-800 dark:text-blue-200': notification.type === 'info'
            }"
          >
            {{ notification.message }}
          </p>
        </div>

        <!-- Close button -->
        <button
          type="button"
          (click)="onClose(notification.id)"
          class="flex-shrink-0 inline-flex rounded-lg p-1.5 hover:bg-black/10 dark:hover:bg-white/10 transition-colors"
          [ngClass]="{
            'text-green-600 dark:text-green-400': notification.type === 'success',
            'text-red-600 dark:text-red-400': notification.type === 'error',
            'text-yellow-600 dark:text-yellow-400': notification.type === 'warning',
            'text-blue-600 dark:text-blue-400': notification.type === 'info'
          }"
        >
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
            <path
              fill-rule="evenodd"
              d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
      </div>

      <!-- Progress bar (optional visual for auto-dismiss) -->
      @if (notification.duration && notification.duration > 0) {
        <div class="h-1 w-full bg-black/10 dark:bg-white/10 overflow-hidden rounded-b-lg">
          <div
            class="h-full animate-progress"
            [ngClass]="{
              'bg-green-600': notification.type === 'success',
              'bg-red-600': notification.type === 'error',
              'bg-yellow-600': notification.type === 'warning',
              'bg-blue-600': notification.type === 'info'
            }"
            [style.animation-duration.ms]="notification.duration"
          ></div>
        </div>
      }
    </div>
  }
</div>
