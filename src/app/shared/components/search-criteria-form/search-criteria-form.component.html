<div class="search-criteria-form">
  <form [formGroup]="searchForm" (ngSubmit)="onSubmit()">
    <!-- Area (Required) -->
    <div class="form-group mb-4">
      <label for="area" class="mb-1 block text-sm font-medium">
        Area <span class="text-red-600">*</span>
      </label>
      <input
        type="text"
        id="area"
        formControlName="area"
        placeholder="e.g., London, SW1A 1AA, or postcode"
        class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-blue-600 focus:outline-none"
      />
      @if (searchForm.get('area')?.invalid && searchForm.get('area')?.touched) {
        <small class="mt-1 text-sm text-red-600">Area is required</small>
      }
    </div>

    <!-- Radius -->
    <div class="form-group mb-4">
      <label for="radius" class="mb-1 block text-sm font-medium">Search Radius (miles)</label>
      <div class="relative">
        <select
          id="radius"
          formControlName="radius"
          class="w-full appearance-none rounded-lg border border-gray-300 py-2 pr-10 pl-3 focus:ring-2 focus:ring-blue-600 focus:outline-none"
        >
          @for (option of radiusOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center">
          <svg class="h-4 w-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </div>
      </div>
    </div>

    <!-- Property Types -->
    <div class="form-group mb-4">
      <label for="property_types" class="mb-1 block text-sm font-medium">Property Type</label>
      <div class="relative">
        <select
          id="property_types"
          formControlName="property_types"
          class="w-full appearance-none rounded-lg border border-gray-300 py-2 pr-10 pl-3 focus:ring-2 focus:ring-blue-600 focus:outline-none"
        >
          @for (type of propertyTypes; track type.value) {
            <option [value]="type.value">{{ type.label }}</option>
          }
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center">
          <svg class="h-4 w-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </div>
      </div>
    </div>

    <!-- Bedrooms -->
    <div class="mb-4 grid grid-cols-2 gap-4">
      <div class="form-group">
        <label for="bedrooms_min" class="mb-1 block text-sm font-medium">Min Bedrooms</label>
        <div class="relative">
          <select
            id="bedrooms_min"
            formControlName="bedrooms_min"
            class="w-full appearance-none rounded-lg border border-gray-300 py-2 pr-10 pl-3 focus:ring-2 focus:ring-blue-600 focus:outline-none"
          >
            <option [value]="null">Any</option>
            @for (bedroom of bedroomOptions; track bedroom) {
              <option [value]="bedroom">{{ bedroom }}</option>
            }
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center">
            <svg
              class="h-4 w-4 text-gray-500"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              />
            </svg>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label for="bedrooms_max" class="mb-1 block text-sm font-medium">Max Bedrooms</label>
        <div class="relative">
          <select
            id="bedrooms_max"
            formControlName="bedrooms_max"
            class="w-full appearance-none rounded-lg border border-gray-300 py-2 pr-10 pl-3 focus:ring-2 focus:ring-blue-600 focus:outline-none"
          >
            <option [value]="null">Any</option>
            @for (bedroom of bedroomOptions; track bedroom) {
              <option [value]="bedroom">{{ bedroom }}</option>
            }
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center">
            <svg
              class="h-4 w-4 text-gray-500"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              />
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Price -->
    <div class="mb-4 grid grid-cols-2 gap-4">
      <div class="form-group">
        <label for="price_min" class="mb-1 block text-sm font-medium">Min Price (£)</label>
        <div class="relative">
          <select
            id="price_min"
            formControlName="price_min"
            class="w-full appearance-none rounded-lg border border-gray-300 py-2 pr-10 pl-3 focus:ring-2 focus:ring-blue-600 focus:outline-none"
          >
            <option [value]="null">Any</option>
            @for (price of priceOptions; track price) {
              <option [value]="price">£{{ price | number }}</option>
            }
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center">
            <svg
              class="h-4 w-4 text-gray-500"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              />
            </svg>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label for="price_max" class="mb-1 block text-sm font-medium">Max Price (£)</label>
        <div class="relative">
          <select
            id="price_max"
            formControlName="price_max"
            class="w-full appearance-none rounded-lg border border-gray-300 py-2 pr-10 pl-3 focus:ring-2 focus:ring-blue-600 focus:outline-none"
          >
            <option [value]="null">Any</option>
            @for (price of priceOptions; track price) {
              <option [value]="price">£{{ price | number }}</option>
            }
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center">
            <svg
              class="h-4 w-4 text-gray-500"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              />
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Max Days Since Added -->
    <div class="form-group mb-6">
      <label for="max_days_since_added" class="mb-1 block text-sm font-medium">Added within</label>
      <div class="relative">
        <select
          id="max_days_since_added"
          formControlName="max_days_since_added"
          class="w-full appearance-none rounded-lg border border-gray-300 py-2 pr-10 pl-3 focus:ring-2 focus:ring-blue-600 focus:outline-none"
        >
          @for (option of daysSinceAddedOptions; track option.label) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-3 flex items-center">
          <svg class="h-4 w-4 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </div>
      </div>
    </div>

    <!-- Submit Button -->
    @if (showSubmitButton()) {
      <div
        class="flex"
        [class.justify-between]="showCancelButton()"
        [class.justify-end]="!showCancelButton()"
      >
        @if (showCancelButton()) {
          <button
            type="button"
            (click)="onCancel()"
            class="rounded-lg border border-gray-300 px-6 py-2 font-medium text-gray-700 transition-colors hover:bg-gray-50"
          >
            Cancel
          </button>
        }
        <button
          type="submit"
          [disabled]="!isFormValid"
          class="rounded-lg bg-blue-600 px-6 py-2 font-medium text-white transition-colors hover:bg-blue-700 disabled:bg-gray-400"
        >
          {{ submitButtonText() }}
        </button>
      </div>
    }
  </form>
</div>
