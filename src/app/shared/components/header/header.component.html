<header
  class="sticky top-0 z-10 border-b border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-800"
>
  <div class="flex h-16 items-center justify-between px-4">
    <!-- Left: Menu toggle & Logo -->
    <div class="flex items-center gap-4">
      <button
        (click)="onToggleSidebar()"
        class="rounded-lg p-2 transition-colors hover:bg-gray-100 dark:hover:bg-gray-700"
        aria-label="Toggle sidebar"
      >
        <svg
          class="h-6 w-6 text-gray-600 dark:text-gray-300"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </button>

      <a
        routerLink="/home"
        class="flex cursor-pointer items-center gap-2 transition-opacity hover:opacity-80"
      >
        <svg class="h-8 w-8 text-blue-600" fill="currentColor" viewBox="0 0 24 24">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
        </svg>
        <h1 class="text-xl font-semibold text-gray-900 dark:text-white">Homely</h1>
      </a>
    </div>

    <!-- Right: Theme toggle & User menu -->
    <div class="flex items-center gap-2">
      <button
        (click)="onToggleTheme()"
        class="rounded-lg p-2 transition-colors hover:bg-gray-100 dark:hover:bg-gray-700"
        aria-label="Toggle theme"
      >
        @if (uiStore.theme() === 'light') {
          <svg
            class="h-5 w-5 text-gray-600 dark:text-gray-300"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
            />
          </svg>
        } @else {
          <svg
            class="h-5 w-5 text-gray-600 dark:text-gray-300"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
            />
          </svg>
        }
      </button>

      @if (authStore.isAuthenticated()) {
        <app-notification-bell />
        <button
          (click)="onLogout()"
          class="rounded-lg px-4 py-2 text-sm font-medium text-red-600 transition-colors hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-900/20"
          aria-label="Logout"
        >
          Logout
        </button>
      }

      <button
        class="rounded-lg p-2 transition-colors hover:bg-gray-100 dark:hover:bg-gray-700"
        aria-label="User menu"
      >
        <svg
          class="h-6 w-6 text-gray-600 dark:text-gray-300"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
          />
        </svg>
      </button>
    </div>
  </div>
</header>
