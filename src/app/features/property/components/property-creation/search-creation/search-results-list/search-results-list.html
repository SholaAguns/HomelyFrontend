<div class="search-results">
  <div class="results-container">
    <div class="results-header">
      @if (status() === 'COMPLETED') {
        <div class="success-icon">✓</div>
        <h3>Search Completed Successfully</h3>
      } @else if (status() === 'FAILED') {
        <div class="error-icon">✗</div>
        <h3>Search Failed</h3>
      }
    </div>

    <div class="results-summary">
      <div class="summary-card created">
        <div class="summary-number">{{ completedItems() }}</div>
        <div class="summary-label">Properties Created</div>
      </div>

      <div class="summary-card duplicates">
        <div class="summary-number">{{ duplicatesSkipped }}</div>
        <div class="summary-label">Duplicates Skipped</div>
      </div>

      <div class="summary-card failed">
        <div class="summary-number">{{ failedItems() }}</div>
        <div class="summary-label">Failed</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" (click)="navigateToPropertyList()">View Property List</button>
      <button class="btn btn-secondary" (click)="startNewSearch()">Start New Search</button>
    </div>
  </div>
</div>
