<div class="search-creation-container">
  <div class="header">
    <h2>Bulk Search from Rightmove</h2>
    <p class="subtitle">Search Rightmove for properties and add them to your list</p>
  </div>

  <!-- Search Criteria Form -->
  @if (currentView() === 'criteria') {
    <app-search-criteria-form
      [searchCriteria]="existingSearchCriteria()"
      [submitButtonText]="'Start Search'"
      [showCancelButton]="false"
      (searchSubmit)="onSearchSubmit($event)"
    />
  }

  <!-- Progress View -->
  @if (currentView() === 'progress') {
    <app-loading-spinner message="Creating properties from search results..." size="large" />
  }
</div>
