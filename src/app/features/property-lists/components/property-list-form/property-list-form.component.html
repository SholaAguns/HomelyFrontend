<div class="mx-auto max-w-2xl rounded-lg bg-white p-6 shadow-md dark:bg-gray-800">
  <h2 class="mb-6 text-2xl font-bold text-gray-900 dark:text-white">
    {{ isEditMode ? 'Edit Property List' : 'Create Property List' }}
  </h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-4">
      <label for="title" class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-300">
        Title <span class="text-red-500">*</span>
      </label>
      <input
        id="title"
        type="text"
        formControlName="title"
        class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:border-transparent focus:ring-2 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400"
        placeholder="e.g., Properties in Manchester"
      />
      @if (form.get('title')?.invalid && form.get('title')?.touched) {
        <p class="mt-1 text-sm text-red-500">
          @if (form.get('title')?.errors?.['required']) {
            Title is required.
          }
          @if (form.get('title')?.errors?.['minlength']) {
            Title must be at least 3 characters.
          }
        </p>
      }
    </div>

    <div class="flex gap-3">
      <button
        type="submit"
        [disabled]="form.invalid || isSubmitting"
        class="flex-1 rounded-lg bg-blue-600 px-6 py-2 font-medium text-white transition-colors hover:bg-blue-700 disabled:cursor-not-allowed disabled:bg-gray-400"
      >
        {{ isEditMode ? 'Update' : 'Create' }}
      </button>
      <button
        type="button"
        (click)="onCancel()"
        class="rounded-lg border border-gray-300 px-6 py-2 font-medium transition-colors hover:bg-gray-50 dark:border-gray-600 dark:text-gray-300 dark:hover:bg-gray-700"
      >
        Cancel
      </button>
    </div>
  </form>
</div>
