<div class="container mx-auto max-w-2xl px-4 py-8">
  <h1 class="mb-8 text-3xl font-bold text-gray-900">Create Property List</h1>

  @if (error()) {
    <div class="mb-6 rounded-lg border border-red-200 bg-red-50 p-4 text-red-800">
      <h3 class="mb-2 font-semibold">Error</h3>
      <p>{{ error() }}</p>
    </div>
  }

  <div class="rounded-lg bg-white p-8 shadow-md">
    <form (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label for="area" class="mb-1 block text-sm font-medium">
          Area <span class="text-red-600">*</span>
        </label>
        <input
          id="area"
          type="text"
          [(ngModel)]="searchCriteria.area"
          name="area"
          required
          placeholder="e.g. London, SW1A 1AA, or postcode"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-blue-600 focus:outline-none"
        />
      </div>

      <div class="mb-4">
        <label for="radius" class="mb-1 block text-sm font-medium"> Search Radius (miles) </label>
        <input
          id="radius"
          type="number"
          [(ngModel)]="searchCriteria.radius"
          name="radius"
          min="0"
          max="40"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-blue-600 focus:outline-none"
        />
      </div>

      <div class="mb-4">
        <label for="propertyType" class="mb-1 block text-sm font-medium"> Property Type </label>
        <select
          id="propertyType"
          [(ngModel)]="searchCriteria.property_types"
          name="propertyType"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-blue-600 focus:outline-none"
        >
          <option value="any">Any</option>
          <option value="houses">Houses</option>
          <option value="flats">Flats</option>
        </select>
      </div>

      <div class="mb-4 grid grid-cols-2 gap-4">
        <div>
          <label for="minPrice" class="mb-1 block text-sm font-medium"> Min Price </label>
          <input
            id="minPrice"
            type="number"
            [(ngModel)]="searchCriteria.price_min"
            name="minPrice"
            class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-blue-600 focus:outline-none"
            placeholder="£"
          />
        </div>
        <div>
          <label for="maxPrice" class="mb-1 block text-sm font-medium"> Max Price </label>
          <input
            id="maxPrice"
            type="number"
            [(ngModel)]="searchCriteria.price_max"
            name="maxPrice"
            class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-blue-600 focus:outline-none"
            placeholder="£"
          />
        </div>
      </div>

      <div class="mb-6 grid grid-cols-2 gap-4">
        <div>
          <label for="minBedrooms" class="mb-1 block text-sm font-medium"> Min Bedrooms </label>
          <input
            id="minBedrooms"
            type="number"
            [(ngModel)]="searchCriteria.bedrooms_min"
            name="minBedrooms"
            min="0"
            class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-blue-600 focus:outline-none"
          />
        </div>
        <div>
          <label for="maxBedrooms" class="mb-1 block text-sm font-medium"> Max Bedrooms </label>
          <input
            id="maxBedrooms"
            type="number"
            [(ngModel)]="searchCriteria.bedrooms_max"
            name="maxBedrooms"
            min="0"
            class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-blue-600 focus:outline-none"
          />
        </div>
      </div>

      <div class="flex justify-between">
        <button
          type="button"
          (click)="onCancel()"
          class="rounded-lg border border-gray-300 px-6 py-2 font-medium text-gray-700 transition-colors hover:bg-gray-50"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="!searchCriteria.area.trim() || submitting()"
          class="rounded-lg bg-blue-600 px-6 py-2 font-medium text-white transition-colors hover:bg-blue-700 disabled:bg-gray-400"
        >
          @if (submitting()) {
            <span>Creating...</span>
          } @else {
            <span>Create List</span>
          }
        </button>
      </div>
    </form>
  </div>
</div>
