<div class="container mx-auto max-w-2xl px-4 py-8">
  <h1 class="mb-8 text-3xl font-bold text-gray-900 dark:text-white">Create Property List</h1>

  @if (error()) {
    <div
      class="mb-6 rounded-lg border border-red-200 bg-red-50 p-4 text-red-800 dark:border-red-800 dark:bg-red-900/20 dark:text-red-400"
    >
      <h3 class="mb-2 font-semibold">Error</h3>
      <p>{{ error() }}</p>
    </div>
  }

  <!-- Mode selection -->
  @if (mode() === 'choose') {
    <div class="grid gap-4 sm:grid-cols-2">
      <button
        type="button"
        (click)="selectMode('blank')"
        class="flex flex-col items-start rounded-lg bg-white p-6 text-left shadow-md transition-shadow hover:shadow-lg dark:bg-gray-800"
      >
        <div
          class="mb-3 flex h-10 w-10 items-center justify-center rounded-full bg-blue-100 dark:bg-blue-900/30"
        >
          <svg
            class="h-5 w-5 text-blue-600 dark:text-blue-400"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
            />
          </svg>
        </div>
        <h2 class="mb-1 text-lg font-semibold text-gray-900 dark:text-white">Blank List</h2>
        <p class="text-sm text-gray-500 dark:text-gray-400">
          Create an empty list and add properties manually or via HTML import
        </p>
      </button>

      <button
        type="button"
        (click)="selectMode('search')"
        class="flex flex-col items-start rounded-lg bg-white p-6 text-left shadow-md transition-shadow hover:shadow-lg dark:bg-gray-800"
      >
        <div
          class="mb-3 flex h-10 w-10 items-center justify-center rounded-full bg-green-100 dark:bg-green-900/30"
        >
          <svg
            class="h-5 w-5 text-green-600 dark:text-green-400"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>
        </div>
        <h2 class="mb-1 text-lg font-semibold text-gray-900 dark:text-white">Search & Scrape</h2>
        <p class="text-sm text-gray-500 dark:text-gray-400">
          Set search criteria and automatically scrape properties from Rightmove and Zoopla
        </p>
      </button>
    </div>
  }

  <!-- Blank list form -->
  @if (mode() === 'blank') {
    <div class="space-y-4 rounded-lg bg-white p-8 shadow-md dark:bg-gray-800">
      <div>
        <label
          for="blankTitle"
          class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-300"
        >
          List Name <span class="text-gray-400">(optional)</span>
        </label>
        <input
          id="blankTitle"
          type="text"
          [ngModel]="blankTitle()"
          (ngModelChange)="blankTitle.set($event)"
          placeholder="e.g. London Flats, South East Search..."
          class="w-full rounded-md border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400"
        />
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
          Leave blank to auto-generate a name
        </p>
      </div>

      <div class="flex justify-end space-x-3 pt-2">
        <button
          type="button"
          (click)="onCancel()"
          class="rounded-md border border-gray-300 bg-white px-4 py-2 text-gray-700 hover:bg-gray-50 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-300 dark:hover:bg-gray-600"
          [disabled]="submitting()"
        >
          Back
        </button>
        <button
          type="button"
          (click)="onCreateBlank()"
          class="flex items-center rounded-md bg-blue-600 px-4 py-2 text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50"
          [disabled]="submitting()"
        >
          @if (submitting()) {
            <svg
              class="mr-2 -ml-1 h-4 w-4 animate-spin text-white"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
            Creating...
          } @else {
            Create List
          }
        </button>
      </div>
    </div>
  }

  <!-- Search & scrape form -->
  @if (mode() === 'search') {
    <div class="rounded-lg bg-white p-8 shadow-md dark:bg-gray-800">
      <app-search-criteria-form (searchSubmit)="onSearchSubmit($event)" (cancel)="onCancel()" />
    </div>
  }
</div>
