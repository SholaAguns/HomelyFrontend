<div class="container mx-auto px-4 py-8">
  <div class="mb-6">
    <a routerLink="/lists" class="text-blue-600 hover:underline"
      >&larr; Back to lists</a
    >
  </div>

  @if (store.error()) {
  <div
    class="max-w-2xl mx-auto mb-6 bg-red-50 border border-red-200 rounded-lg p-4 text-red-800"
  >
    <h3 class="font-semibold mb-2">Error creating property list</h3>
    <p>{{ store.error() }}</p>
  </div>
  }

  <app-property-list-form (submit)="onCreate($event)" (cancel)="onCancel()" />
</div>
