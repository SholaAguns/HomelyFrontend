<div class="container mx-auto px-4 py-8">
  <div class="mb-8 flex items-center justify-between">
    <h1 class="text-3xl font-bold text-gray-900 dark:text-white">My Property Lists</h1>
    <button
      (click)="navigateToCreate()"
      class="rounded-lg bg-blue-600 px-6 py-3 font-medium text-white shadow-md transition-colors hover:bg-blue-700"
    >
      + Create New List
    </button>
  </div>

  @if (store.loading()) {
    <div class="flex items-center justify-center py-16">
      <div class="h-12 w-12 animate-spin rounded-full border-b-2 border-blue-600"></div>
    </div>
  } @else if (store.error()) {
    <div
      class="rounded-lg border border-red-200 bg-red-50 p-4 text-red-800 dark:border-red-800 dark:bg-red-900/20 dark:text-red-400"
    >
      <h3 class="mb-2 font-semibold">Error loading property lists</h3>
      <p>{{ store.error() }}</p>
    </div>
  } @else if (store.count() === 0) {
    <div class="py-16 text-center">
      <svg
        class="mx-auto mb-4 h-24 w-24 text-gray-400"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
        />
      </svg>
      <h3 class="mb-2 text-xl font-semibold text-gray-900 dark:text-white">
        No property lists yet
      </h3>
      <p class="mb-6 text-gray-600 dark:text-gray-400">
        Get started by creating your first property list
      </p>
      <button
        (click)="navigateToCreate()"
        class="rounded-lg bg-blue-600 px-6 py-3 font-medium text-white transition-colors hover:bg-blue-700"
      >
        Create Your First List
      </button>
    </div>
  } @else {
    <div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3">
      @for (list of store.all(); track list.uuid) {
        <app-property-list-card [list]="list" />
      }
    </div>
  }
</div>
