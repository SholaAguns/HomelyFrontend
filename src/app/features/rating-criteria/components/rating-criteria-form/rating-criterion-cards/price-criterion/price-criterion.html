<div class="criteria-section">
  <h3>Price Rating Criteria</h3>
  <p class="section-description">Based on property price</p>

  <div class="criteria-list">
    <div class="criterion-item" [class.disabled]="!isCriterionEnabled(priceCriterion()?.enabled)">
      <div class="criterion-header">
        <div class="criterion-info">
          <label class="checkbox-label enable-toggle">
            <input
              type="checkbox"
              [checked]="isCriterionEnabled(priceCriterion()?.enabled)"
              (change)="toggleCriterionEnabled()"
            />
            <span class="criterion-name">{{ priceCriterion()?.name }}</span>
          </label>
        </div>
      </div>

      @if (isCriterionEnabled(priceCriterion()?.enabled)) {
        <div class="criterion-controls">
          <div class="control-group">
            <label>Weight</label>
            <select
              (change)="updateCriterionWeight(+$any($event.target).value)"
              class="form-control-sm"
            >
              @for (weight of weightValues; track weight) {
                <option [value]="weight" [selected]="priceCriterion()?.weight === weight">
                  {{ weightLabels[weight] }}
                </option>
              }
            </select>
          </div>

          <div class="control-group">
            <label class="checkbox-label">
              <input
                type="checkbox"
                [checked]="priceCriterion()?.is_dealbreaker"
                (change)="updateCriterionIsDealbreaker($any($event.target).checked)"
              />
              <span>Dealbreaker</span>
            </label>
            @if (isCriterionEnabled(priceCriterion()?.is_dealbreaker)) {
              <div class="form-group mb-4">
                <label for="dealbreaker_below_price" class="mb-1 block text-sm font-medium"
                  >Below (reject if lower):</label
                >
                <select
                  id="dealbreaker_below_price"
                  (change)="updateCriterionBelowPriceThreshold(+$any($event.target).value)"
                  class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-blue-600 focus:outline-none"
                >
                  <option value="">Not set</option>
                  @for (price of pricesOptions; track price) {
                    <option
                      [value]="price * 1000"
                      [selected]="
                        priceCriterion()?.dealbreaker_threshold?.['below'] === price * 1000
                      "
                    >
                      £{{ (price * 1000).toLocaleString() }}
                    </option>
                  }
                </select>
              </div>
              <div class="form-group mb-4">
                <label for="dealbreaker_above_price" class="mb-1 block text-sm font-medium"
                  >Above (reject if higher):</label
                >
                <select
                  id="dealbreaker_above_price"
                  (change)="updateCriterionAbovePriceThreshold(+$any($event.target).value)"
                  class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-blue-600 focus:outline-none"
                >
                  <option value="">Not set</option>
                  @for (price of pricesOptions; track price) {
                    <option
                      [value]="price * 1000"
                      [selected]="
                        priceCriterion()?.dealbreaker_threshold?.['above'] === price * 1000
                      "
                    >
                      £{{ (price * 1000).toLocaleString() }}
                    </option>
                  }
                </select>
              </div>
            }
          </div>
        </div>
      }
    </div>
  </div>
</div>
