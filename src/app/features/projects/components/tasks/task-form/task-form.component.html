<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  class="rounded-lg border border-gray-200 bg-gray-50 p-3"
>
  <div class="mb-2">
    <input
      formControlName="title"
      type="text"
      placeholder="Task title"
      class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none"
    />
    @if (form.get('title')?.invalid && form.get('title')?.touched) {
      <p class="mt-1 text-xs text-red-600">Title is required.</p>
    }
  </div>

  <div class="mb-2">
    <textarea
      formControlName="description"
      placeholder="Description (optional)"
      rows="2"
      class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none"
    ></textarea>
  </div>

  <div class="mb-3 flex gap-2">
    <div class="relative flex-1">
      <select
        formControlName="status"
        class="w-full appearance-none rounded-md border border-gray-300 py-1.5 pr-8 pl-2 text-sm focus:border-blue-500 focus:outline-none"
      >
        @for (opt of statusOptions; track opt.value) {
          <option [value]="opt.value">{{ opt.label }}</option>
        }
      </select>
      <div class="pointer-events-none absolute inset-y-0 right-2 flex items-center">
        <svg
          class="h-3.5 w-3.5 text-gray-500"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 9l-7 7-7-7"
          />
        </svg>
      </div>
    </div>

    <div class="relative flex-1">
      <select
        formControlName="priority"
        class="w-full appearance-none rounded-md border border-gray-300 py-1.5 pr-8 pl-2 text-sm focus:border-blue-500 focus:outline-none"
      >
        @for (opt of priorityOptions; track opt.value) {
          <option [value]="opt.value">{{ opt.label }}</option>
        }
      </select>
      <div class="pointer-events-none absolute inset-y-0 right-2 flex items-center">
        <svg
          class="h-3.5 w-3.5 text-gray-500"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 9l-7 7-7-7"
          />
        </svg>
      </div>
    </div>

    <input
      formControlName="due_date"
      type="date"
      class="flex-1 rounded-md border border-gray-300 px-2 py-1.5 text-sm focus:border-blue-500 focus:outline-none"
    />
  </div>

  @if (members().length > 0) {
    <div class="mb-3">
      <div class="relative">
        <select
          formControlName="assigned_to_input"
          class="w-full appearance-none rounded-md border border-gray-300 py-1.5 pr-8 pl-2 text-sm focus:border-blue-500 focus:outline-none"
        >
          <option [value]="null">Unassigned</option>
          @for (member of members(); track member.email) {
            <option [value]="member.email">
              {{ member.first_name }} {{ member.last_name }} ({{ member.email }})
            </option>
          }
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-2 flex items-center">
          <svg
            class="h-3.5 w-3.5 text-gray-500"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </div>
      </div>
    </div>
  }

  <div class="flex gap-2">
    <button
      type="submit"
      [disabled]="form.invalid"
      class="rounded-md bg-blue-600 px-4 py-1.5 text-sm font-medium text-white transition-colors hover:bg-blue-700 disabled:opacity-50"
    >
      {{ isEditing ? 'Save Task' : 'Add Task' }}
    </button>
    <button
      type="button"
      (click)="onCancel()"
      class="rounded-md border border-gray-300 px-4 py-1.5 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-50"
    >
      Cancel
    </button>
  </div>
</form>
