@if (isEditing()) {
  <div class="mb-1">
    <app-task-form
      [taskListUuid]="task().task_list_uuid"
      [existingTask]="task()"
      [members]="members()"
      (submitted)="onEditSubmit($event)"
      (cancelled)="onEditCancel()"
    />
  </div>
} @else {
  <div class="flex items-start gap-3 rounded-md px-3 py-2 hover:bg-gray-50 dark:hover:bg-gray-700">
    <button
      (click)="toggleComplete()"
      [disabled]="!canEdit()"
      [title]="task().status === 'DONE' ? 'Mark incomplete' : 'Mark complete'"
      class="mt-0.5 shrink-0 rounded-full transition-colors focus:outline-none disabled:cursor-default"
    >
      @if (task().status === 'DONE') {
        <svg class="h-5 w-5 text-green-500" fill="currentColor" viewBox="0 0 20 20">
          <path
            fill-rule="evenodd"
            d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
            clip-rule="evenodd"
          />
        </svg>
      } @else {
        <svg
          class="h-5 w-5 text-gray-300 hover:text-gray-400 dark:text-gray-600"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <circle cx="12" cy="12" r="10" stroke-width="1.5" />
        </svg>
      }
    </button>

    <button
      (click)="cycleStatus()"
      [class]="statusStyles[task().status]"
      [title]="canEdit() ? 'Click to change status' : task().status_display"
      class="mt-0.5 shrink-0 rounded px-2 py-0.5 text-xs font-medium transition-colors"
      [disabled]="!canEdit()"
    >
      {{ task().status_display }}
    </button>

    <div class="min-w-0 flex-1">
      <p
        class="text-sm text-gray-900 dark:text-white"
        [class.line-through]="task().status === 'DONE'"
        [class.text-gray-400]="task().status === 'DONE' || task().status === 'CANCELLED'"
      >
        {{ task().title }}
      </p>
      @if (task().description) {
        <p class="mt-0.5 text-xs text-gray-500 dark:text-gray-400">{{ task().description }}</p>
      }
      @if (task().due_date) {
        <p class="mt-0.5 text-xs text-gray-400 dark:text-gray-500">Due: {{ task().due_date }}</p>
      }
      @if (task().assigned_to_email) {
        <p class="mt-0.5 text-xs text-gray-400 dark:text-gray-500">
          Assigned: {{ task().assigned_to_email }}
        </p>
      }
    </div>

    <span
      [class]="priorityStyles[task().priority]"
      class="shrink-0 rounded px-2 py-0.5 text-xs font-medium"
    >
      {{ task().priority_display }}
    </span>

    @if (canEdit()) {
      <div class="flex shrink-0 gap-1">
        <button
          (click)="startEdit()"
          class="rounded p-1 text-gray-400 transition-colors hover:text-blue-600 dark:text-gray-500"
          title="Edit"
        >
          <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
            />
          </svg>
        </button>
        <button
          (click)="onDelete()"
          class="rounded p-1 text-gray-400 transition-colors hover:text-red-600 dark:text-gray-500"
          title="Delete"
        >
          <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
            />
          </svg>
        </button>
      </div>
    }
  </div>
}
