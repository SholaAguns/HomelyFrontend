<div class="container mx-auto max-w-4xl px-4 py-8">
  <h1 class="mb-8 text-center text-3xl font-bold text-gray-900 dark:text-white">
    Create New Project
  </h1>

  <div class="mb-8">
    <app-progress-indicator [steps]="steps" [currentStep]="currentStep()" />
  </div>

  @if (error()) {
    <div
      class="mb-6 rounded-lg border border-red-200 bg-red-50 p-4 text-red-800 dark:border-red-800 dark:bg-red-900/20 dark:text-red-400"
    >
      <h3 class="mb-2 font-semibold">Error creating project</h3>
      <p>{{ error() }}</p>
    </div>
  }

  <div class="rounded-lg bg-white p-8 shadow-md dark:bg-gray-800">
    @if (currentStep() === 0) {
      <app-step1-basic-info
        [initialData]="{ title: projectData().title, description: projectData().description || '' }"
        (complete)="onStep1Complete($event)"
      />
    } @else if (currentStep() === 1) {
      <app-step2-context-options
        (complete)="onStep2Complete($event)"
        (skip)="onStep2Skip()"
        (back)="back()"
      />
    }

    @if (submitting()) {
      <div class="mt-6 flex items-center justify-center">
        <div class="h-8 w-8 animate-spin rounded-full border-b-2 border-blue-600"></div>
        <span class="ml-3 text-gray-600 dark:text-gray-400">Creating project...</span>
      </div>
    }
  </div>
</div>
