<div class="flex flex-col gap-2">
  <textarea
    [(ngModel)]="body"
    rows="3"
    placeholder="Add a comment..."
    class="w-full resize-none rounded-lg border border-gray-200 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none"
  ></textarea>
  <div class="flex justify-end gap-2">
    <button
      type="button"
      (click)="onCancel()"
      class="rounded-md border border-gray-200 px-3 py-1.5 text-sm text-gray-600 transition-colors hover:bg-gray-50"
    >
      Cancel
    </button>
    <button
      type="button"
      (click)="onSubmit()"
      [disabled]="!body.trim()"
      class="rounded-md bg-blue-600 px-3 py-1.5 text-sm font-medium text-white transition-colors hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50"
    >
      Post
    </button>
  </div>
</div>
